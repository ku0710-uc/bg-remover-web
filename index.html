<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背景除去アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    .panel { flex: 1; min-width: 280px; }
    .box { border: 1px solid #ccc; border-radius: 8px; min-height: 240px;
           display: flex; align-items: center; justify-content: center; }
    .box img { max-width: 100%; max-height: 480px; }
    /* 「透明」のときの市松模様 */
    .checker { background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 20px 20px; }
    #status { margin: 1rem 0; color: #555; }
  </style>
</head>
<body>
  <h1>背景除去アプリ</h1>
  <p>画像はサーバーに送られず、あなたのブラウザの中だけで処理されます。</p>

  <div class="controls">
    <input id="file" type="file" accept="image/*" />
    <label>表示する背景の色:
      <select id="bg">
        <option value="checker">透明</option>
        <option value="#ffffff">白</option>
        <option value="#000000">黒</option>
        <option value="#00b140">緑</option>
      </select>
    </label>
  </div>

  <div id="status">画像を選んでください。初回はAIモデルの読み込みに時間がかかります。</div>

  <div class="row">
    <div class="panel">
      <h3>元の画像</h3>
      <div class="box"><img id="original" alt="" /></div>
    </div>
    <div class="panel">
      <h3>背景を消した画像</h3>
      <div class="box checker" id="resultBox"><img id="result" alt="" /></div>
      <p><a id="download" download="result.png" hidden>透明PNGとして保存</a></p>
    </div>
  </div>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

    const fileInput = document.getElementById("file");
    const bgSelect = document.getElementById("bg");
    const statusEl = document.getElementById("status");
    const originalImg = document.getElementById("original");
    const resultImg = document.getElementById("result");
    const resultBox = document.getElementById("resultBox");
    const downloadLink = document.getElementById("download");

    let segmenter = null;

    // AIモデルは最初の1回だけ読み込む
    async function getSegmenter() {
      if (!segmenter) {
        statusEl.textContent = "AIモデルを読み込み中です(初回のみ時間がかかります)…";
        segmenter = await pipeline("background-removal", "briaai/RMBG-1.4", { dtype: "fp32" });
      }
      return segmenter;
    }

    // 表示する背景の色を切り替える(保存されるPNGは透明のまま)
    function applyBackground() {
      if (bgSelect.value === "checker") {
        resultBox.classList.add("checker");
        resultBox.style.background = "";
      } else {
        resultBox.classList.remove("checker");
        resultBox.style.background = bgSelect.value;
      }
    }
    bgSelect.addEventListener("change", applyBackground);

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      originalImg.src = url;
      resultImg.removeAttribute("src");
      downloadLink.hidden = true;

      try {
        const seg = await getSegmenter();
        statusEl.textContent = "背景を消しています…";
        const output = await seg(url);
        const image = Array.isArray(output) ? output[0] : output;
        const blob = await image.toBlob();
        const outUrl = URL.createObjectURL(blob);

        resultImg.src = outUrl;
        downloadLink.href = outUrl;
        downloadLink.hidden = false;
        applyBackground();
        statusEl.textContent = "完了しました。";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "エラーが出ました: " + error.message;
      }
    });
  </script>
</body>
</html>
