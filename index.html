<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背景除去アプリ</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1c2430;
      --muted: #5b6676;
      --border: #d9dee6;
      --accent: #2557d6;
      --accent-text: #ffffff;
      --accent-soft: #e8eefc;
      --error: #b3261e;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161c;
        --surface: #1b212a;
        --text: #e8ecf2;
        --muted: #9aa5b5;
        --border: #313a47;
        --accent: #6f9bff;
        --accent-text: #0d1424;
        --accent-soft: #223152;
        --error: #ff8a80;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }

    header h1 { margin: 0 0 4px; font-size: clamp(1.5rem, 4vw, 2rem); letter-spacing: 0.02em; }
    header p { margin: 0; color: var(--muted); }

    /* ---- ドロップ領域 ---- */
    .drop {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; margin-top: 24px; padding: 36px 16px;
      border: 2px dashed var(--border); border-radius: var(--radius);
      background: var(--surface); text-align: center; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .drop:hover, .drop.dragover { border-color: var(--accent); background: var(--accent-soft); }
    .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
    .drop input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .drop .big { font-size: 1.1rem; font-weight: 600; }
    .drop .small { color: var(--muted); font-size: .9rem; }
    .drop.busy { pointer-events: none; opacity: .6; }

    /* ---- 状態表示 ---- */
    .status { display: flex; align-items: center; gap: 10px; min-height: 28px; margin: 16px 0 4px; color: var(--muted); }
    .status.error { color: var(--error); }
    .spinner {
      width: 18px; height: 18px; flex: none; display: none;
      border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .status.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

    .progress { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: none; }
    .progress.show { display: block; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    /* ---- 背景色の選択 ---- */
    .options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; }
    .options legend, .options .label { color: var(--muted); font-size: .9rem; }
    fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
    .chip span {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: .9rem;
    }
    .chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
    .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); display: inline-block; }
    .swatch.checker { background: repeating-conic-gradient(#bbb 0% 25%, #fff 0% 50%) 50% / 8px 8px; }

    /* ---- 結果 ---- */
    .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 1rem; }
    .frame {
      min-height: 220px; display: flex; align-items: center; justify-content: center;
      border-radius: 10px; overflow: hidden; background: var(--bg); color: var(--muted); font-size: .9rem;
    }
    .frame img { display: block; max-width: 100%; max-height: 480px; }
    .frame.checker { background: repeating-conic-gradient(#d8d8d8 0% 25%, #fff 0% 50%) 50% / 20px 20px; }

    .actions { margin-top: 12px; min-height: 40px; }
    .btn {
      display: inline-block; padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: .95rem;
      background: var(--accent); color: var(--accent-text); text-decoration: none;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .btn[hidden] { display: none; }
    .note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>背景除去アプリ</h1>
      <p>画像はサーバーに送られず、あなたのブラウザの中だけで処理されます。</p>
    </header>

    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/*" />
      <span class="big">画像をここにドラッグ&ドロップ</span>
      <span class="small">またはクリックして選択(初回はAIモデルの読み込みで30秒ほどかかります)</span>
    </label>

    <div class="status" id="status" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <span id="statusText">画像を選んでください。</span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"><div id="progressBar"></div></div>

    <div class="options">
      <fieldset>
        <legend>表示する背景の色</legend>
        <label class="chip"><input type="radio" name="bg" value="checker" checked /><span><i class="swatch checker"></i>透明</span></label>
        <label class="chip"><input type="radio" name="bg" value="#ffffff" /><span><i class="swatch" style="background:#fff"></i>白</span></label>
        <label class="chip"><input type="radio" name="bg" value="#000000" /><span><i class="swatch" style="background:#000"></i>黒</span></label>
        <label class="chip"><input type="radio" name="bg" value="#00b140" /><span><i class="swatch" style="background:#00b140"></i>緑</span></label>
      </fieldset>
    </div>

    <section class="results">
      <div class="card">
        <h2>元の画像</h2>
        <div class="frame" id="originalFrame"><span>ここに表示されます</span></div>
      </div>
      <div class="card">
        <h2>背景を消した画像</h2>
        <div class="frame checker" id="resultFrame"><span>ここに表示されます</span></div>
        <div class="actions">
          <a class="btn" id="download" download="result.png" hidden>透明PNGとして保存</a>
          <p class="note">背景色の選択は表示だけです。保存されるPNGは背景が透明のままです。</p>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

    const $ = (id) => document.getElementById(id);
    const drop = $("drop"), fileInput = $("file");
    const statusEl = $("status"), statusText = $("statusText");
    const progress = $("progress"), progressBar = $("progressBar");
    const originalFrame = $("originalFrame"), resultFrame = $("resultFrame");
    const downloadLink = $("download");

    let segmenter = null;
    let busy = false;
    let urls = [];   // 作ったURLを覚えておき、次の処理の前に解放する

    function setStatus(text, mode = "") {
      statusText.textContent = text;
      statusEl.className = "status " + mode;   // "", "loading", "error"
    }
    function setProgress(percent) {
      if (percent == null) { progress.classList.remove("show"); return; }
      progress.classList.add("show");
      progressBar.style.width = Math.max(0, Math.min(100, percent)) + "%";
    }
    function showImage(frame, src) {
      frame.textContent = "";
      const img = document.createElement("img");
      img.alt = "";
      img.src = src;
      frame.appendChild(img);
    }

    // AIモデルは最初の1回だけ読み込む。ダウンロードの進み具合を表示する
    async function getSegmenter() {
      if (segmenter) return segmenter;
      const files = {};
      setStatus("AIモデルを読み込み中です(初回のみ)…", "loading");
      setProgress(0);
      segmenter = await pipeline("background-removal", "briaai/RMBG-1.4", {
        dtype: "fp32",
        progress_callback: (info) => {
          if (info.status === "progress" && info.total) {
            files[info.file] = { loaded: info.loaded, total: info.total };
            let loaded = 0, total = 0;
            for (const f of Object.values(files)) { loaded += f.loaded; total += f.total; }
            const pct = total ? (loaded / total) * 100 : 0;
            setProgress(pct);
            setStatus(`AIモデルをダウンロード中… ${Math.round(pct)}%`, "loading");
          }
        },
      });
      setProgress(null);
      return segmenter;
    }

    // 表示する背景の色を切り替える(保存されるPNGは透明のまま)
    function applyBackground() {
      const value = document.querySelector('input[name="bg"]:checked').value;
      if (value === "checker") {
        resultFrame.classList.add("checker");
        resultFrame.style.background = "";
      } else {
        resultFrame.classList.remove("checker");
        resultFrame.style.background = value;
      }
    }
    document.querySelectorAll('input[name="bg"]').forEach((r) => r.addEventListener("change", applyBackground));

    async function handleFile(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        setStatus("画像ファイルを選んでください。", "error");
        return;
      }
      if (busy) {
        setStatus("処理中です。完了してからもう一度選んでください。", "error");
        return;
      }
      busy = true;
      drop.classList.add("busy");

      urls.forEach((u) => URL.revokeObjectURL(u));
      urls = [];
      downloadLink.hidden = true;
      resultFrame.textContent = "処理中…";

      const url = URL.createObjectURL(file);
      urls.push(url);
      showImage(originalFrame, url);

      try {
        const seg = await getSegmenter();
        setStatus("背景を消しています…", "loading");
        const output = await seg(url);
        const image = Array.isArray(output) ? output[0] : output;
        const blob = await image.toBlob();
        const outUrl = URL.createObjectURL(blob);
        urls.push(outUrl);

        showImage(resultFrame, outUrl);
        downloadLink.href = outUrl;
        downloadLink.hidden = false;
        applyBackground();
        setStatus("完了しました。", "");
      } catch (error) {
        console.error(error);
        resultFrame.textContent = "ここに表示されます";
        setStatus("エラーが出ました: " + error.message, "error");
      } finally {
        setProgress(null);
        busy = false;
        drop.classList.remove("busy");
        fileInput.value = "";   // 同じファイルをもう一度選べるようにする
      }
    }

    fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));

    // ドラッグ&ドロップ
    ["dragenter", "dragover"].forEach((type) =>
      drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add("dragover"); }));
    ["dragleave", "drop"].forEach((type) =>
      drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove("dragover"); }));
    drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));

    // ページのどこかに画像を落としても、ブラウザが画像を開いてしまわないようにする
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());
  </script>
</body>
</html>
